[server]
# Used by the manual and Debian systemd units. Listen on all IPv4 interfaces.
# Protect port 8755 with a firewall/VPN: DVMDB has no HTTP authentication.
bind=0.0.0.0
port=8755
# HTTP worker threads (1..256). Request limits are enforced by the server
# itself; see docs/native-database-service.md.
worker_threads=8
# Operations of ONE project that may wait or run at the same time
# (1..worker_threads, default half the workers). Further requests for that
# project get 503 with Retry-After; other projects are not affected.
max_pending_per_project=4

[storage]
root=/var/lib/aowis-dvmdb
# Process-wide logical extent quota for internal bundle export/import and
# verification scratch (MiB). Separate from HTTP staging. This is not a
# filesystem-wide quota and does not cover pack/compaction growth.
max_internal_scratch_mib=1024

# Binary replication transfers use the portable .aowbundle format.
# Each request is bounded; larger snapshots currently require the native CLI.
[sync]
max_transfer_mib=32
max_objects=100000
max_object_mib=8
# Server-wide sum of RESERVED transfer staging, across ALL projects. Each
# active upload or download reserves max_transfer_mib until it ends. A full
# budget returns 503 staging_busy, not 507 (which means actual disk failure).
max_inflight_mib=128

[logging]
# Optional: append diagnostics to a file instead of stderr/journald. The
# systemd unit allows writes to /var/log/aowis-dvmdb only.
#file=/var/log/aowis-dvmdb/server.log
