openapi: 3.1.0
info:
  title: AOWIS DVMDB Service API
  version: 1.0.0-pre
  description: |
    DVMDB HTTP API: projects, branches, immutable revisions, hydraulic
    persistence and merges, revision bundles, repository identity and
    private drafts. All identities are UUIDv7; SHA-256 values are integrity
    data. No authentication. Conventions: docs/rest-api-design.md; errors and
    limits: docs/native-database-service.md.
servers:
  - url: http://127.0.0.1:8755/dvmdb/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': {description: Server process is responding}
  /repository:
    get:
      operationId: getRepositoryIdentity
      description: Stable UUIDv7 identity of this DVMDB catalogue root. Not an authentication token.
      responses:
        '200':
          description: Persistent repository identity
          content:
            application/json:
              schema:
                type: object
                required: [repositoryId]
                additionalProperties: false
                properties:
                  repositoryId: {type: string, format: uuid}
  /repository/tracking:
    get:
      operationId: getRepositoryTracking
      description: |
        Repository role, remote registry and observed tracking refs
        (read-only). An absent tracking entry is distinct from an entry with a null
        observed HEAD (unborn). Endpoint/UUID are configuration, not
        authentication. No branch HEAD is modified by this endpoint.
      responses:
        '200':
          description: Repository-qualified tracking metadata
          content:
            application/json:
              schema:
                type: object
                required: [repositoryId, role, remotes, tracking]
                additionalProperties: false
                properties:
                  repositoryId: {type: string, format: uuid}
                  role: {type: string, enum: [unconfigured, private, shared]}
                  remotes:
                    type: array
                    items:
                      type: object
                      required: [repositoryId, endpoint]
                      additionalProperties: false
                      properties:
                        repositoryId: {type: string, format: uuid}
                        endpoint: {type: string}
                  tracking:
                    type: array
                    items:
                      type: object
                      required: [remoteRepositoryId, projectId, branchId, observedHeadRevisionId]
                      additionalProperties: false
                      properties:
                        remoteRepositoryId: {type: string, format: uuid}
                        projectId: {type: string, format: uuid}
                        branchId: {type: string, format: uuid}
                        observedHeadRevisionId: {type: [string, 'null'], format: uuid}
  /repository/role:
    post:
      operationId: configureRepositoryRole
      description: |
        Explicitly set the durable repository role once, or repeat an identical
        assignment idempotently. The caller must supply the UUIDv7 discovered
        from this repository. Changing an already configured role returns 409.
        This is deployment configuration, not authentication or authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRepositoryId, role]
              properties:
                expectedRepositoryId: {type: string, format: uuid}
                role: {type: string, enum: [private, shared]}
      responses:
        '200': {description: Role configured or already matching, with repositoryId and role}
        '400': {description: Invalid request or unsupported role}
        '409': {description: Repository UUID mismatch or existing conflicting role}
  /ready:
    get:
      operationId: readiness
      responses:
        '200': {description: Catalogue is available}
        '503': {description: Catalogue unavailable}
  /local-commits:
    post:
      operationId: commitSavedWorkingCopy
      description: |
        Idempotently finalize the exact saved private working-copy candidate
        using a caller-supplied operation UUIDv7. The expected HEAD may be null
        for an unborn branch. No commit with an empty or whitespace-only message.
        Timeout recovery must query the operation UUID, never blindly resubmit
        a different operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operationId, draftId, sessionId, fencingToken, expectedGeneration, expectedHead, author, message]
              properties:
                operationId: {type: string, format: uuid}
                draftId: {type: string, format: uuid}
                sessionId: {type: string, format: uuid}
                fencingToken: {type: string, format: uuid}
                expectedGeneration: {type: string, description: Exact decimal generation}
                expectedHead: {type: [string, 'null'], format: uuid}
                author: {type: object}
                message: {type: string, minLength: 1}
      responses:
        '200': {description: Committed with immutable revision UUIDv7}
        '202': {description: Operation is pending; query status by operation UUIDv7}
        '409': {$ref: '#/components/responses/Conflict'}
  /local-commits/{operationId}:
    parameters:
      - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getLocalCommitStatus
      description: Read durable succeeded, pending or rejected status of a commit operation.
      responses:
        '200': {description: Operation status, revision UUIDv7 when succeeded, rejection reason otherwise}
        '404': {$ref: '#/components/responses/NotFound'}
  /working-copies:
    get:
      operationId: listWorkingCopies
      description: |
        List draft metadata in draft-UUID order (no candidate, no journal;
        eventCount is included). No fencing token is returned.
        Paged: pass the previous page's nextCursor as `after`.
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: after, in: query, required: false, schema: {type: string, format: uuid}, description: Last draft UUIDv7 of the previous page}
        - {name: projectId, in: query, required: false, schema: {type: string, format: uuid}, description: Only drafts of this project}
      responses:
        '200': {description: 'workingCopies (each with UUIDv7 IDs, nullable baseRevision and string generation) and nextCursor (draft UUIDv7, or null on the last page)'}
        '400': {description: Invalid limit, cursor, project or unknown query parameter}
    post:
      operationId: createWorkingCopy
      description: |
        Create an uncommitted draft at the exact current HEAD of a local private
        repository. The branch is addressed by UUIDv7. An unborn branch requires
        baseRevision:null. Never creates a revision. With a caller-chosen `id`
        the request is idempotent: repeating it (e.g. after a lost response or
        a transport resend) returns the same draft in its current state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, branchId, baseRevision, sessionId]
              properties:
                id: {type: string, format: uuid, description: Caller-chosen draft UUIDv7 (retry-safe creation)}
                projectId: {type: string, format: uuid}
                branchId: {type: string, format: uuid, description: Existing local branch UUIDv7}
                baseRevision: {type: [string, 'null'], format: uuid}
                sessionId: {type: string, format: uuid}
      responses:
        '201': {description: Persistent draft with UUIDv7 ID, pinned base and generation "0" (or the existing draft for a repeated id)}
        '404': {description: Branch UUIDv7 not found}
        '409': {description: Repository is not private, branch HEAD changed, or id names a different draft}
  /working-copies/{draftId}:
    parameters:
      - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getWorkingCopy
      description: Return the draft's pinned base, generation, lease holder and expiry, candidate overlay (`changes`) and MODEL event journal (`events`, `eventCount`); never the fencing token.
      responses:
        '200': {description: Working-copy metadata, full candidate overlay and event journal}
        '404': {$ref: '#/components/responses/NotFound'}
  /working-copies/{draftId}/networks/{networkId}:
    parameters:
      - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: networkId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getWorkingCopyNetwork
      description: |
        Read one canonical NetworkHydraulic aggregate from a consistent saved
        draft candidate generation over its immutable pinned base. The server
        validates native manifest/chunk membership, typed entity payloads and
        canonical dependency references before returning bytes. This is a
        read-only operation; it neither leases the draft nor changes its HEAD.
      responses:
        '200': {description: 'JSON {draftId, generation (decimal string), networkId, payloadBase64 (canonical MODEL network)}'}
        '400': {description: Invalid UUIDv7 network identity}
        '404': {description: Draft or network absent}
        '413': {description: Canonical response exceeds 8 MiB}
  /working-copies/{draftId}/lease:
    parameters:
      - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: acquireWorkingCopyLease
      description: Acquire or reacquire an exclusive expiring writer lease, rotating the fencing UUIDv7. No automatic takeover until expiry/release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, seconds]
              properties:
                sessionId: {type: string, format: uuid}
                seconds: {type: integer, minimum: 1, maximum: 120}
      responses:
        '200': {description: Fresh token UUIDv7, expiresAtMs and generation as decimal strings}
        '409': {description: Draft has another active writer}
  /working-copies/{draftId}/initialize-network:
    parameters:
      - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: initializeWorkingCopyNetwork
      description: |
        Create the first empty hydraulic network as server-owned manifest data
        in an untouched private unborn draft. Requires the live fenced writer
        and exact generation. The response contains the saved candidate overlay;
        the branch HEAD remains null. Immediate same-writer retry of exactly the
        same root returns the saved generation without another write. Conflicting
        retry or any additional candidate/event write is a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, fencingToken, expectedGeneration, networkId, name]
              properties:
                sessionId: {type: string, format: uuid}
                fencingToken: {type: string, format: uuid}
                expectedGeneration: {type: string, pattern: '^[0-9]{1,20}$'}
                networkId: {type: string, format: uuid, description: UUIDv7}
                name: {type: string, minLength: 1, maxLength: 255}
      responses:
        '200': {description: Unborn draft with durable empty network root and incremented generation}
        '400': {description: Invalid identity, name or malformed request}
        '409': {description: Stale writer, non-unborn draft or existing candidate data}
  /working-copies/{draftId}/save-events:
    parameters:
      - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: saveWorkingCopyEvents
      description: |
        Atomically publish MODEL edit events and candidate model changes in the
        same durable draft update. Idempotent replay of the immediately prior
        identical request returns the saved generation. Event UUIDs are stable
        across retries. The lease and generation are checked. No commit occurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, fencingToken, expectedGeneration, changes, events]
              properties:
                sessionId: {type: string, format: uuid}
                fencingToken: {type: string, format: uuid}
                expectedGeneration: {type: string, pattern: '^[0-9]{1,20}$'}
                changes:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items: {type: object}
                events:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items: {type: string, description: Canonical MODEL edit transaction frame as base64}
                membership:
                  type: array
                  minItems: 1
                  maxItems: 128
                  description: Logical hydraulic membership edits. DVMDB derives native manifest and chunk updates atomically; not available without hydraulic support. Required (non-empty) when any event creates or removes an entity; omit it for update-only batches. A creation/removal without it is rejected with 400.
                  items:
                    type: object
                    additionalProperties: false
                    required: [networkId, entityId, kind, collectionIndex, inserted]
                    properties:
                      networkId: {type: string, format: uuid}
                      entityId: {type: string, format: uuid}
                      kind: {type: integer, minimum: 1, maximum: 65535}
                      collectionIndex: {type: integer, minimum: 0, maximum: 17}
                      inserted: {type: boolean}
      responses:
        '200': {description: 'Small acknowledgement {id, generation (decimal string), eventCount (total events in the journal), acceptedEventIds (this Save''s events)}. Sent after the events are appended and the candidate is stored durably; a replay of the previous identical request returns the same acknowledgement.'}
        '400': {description: 'Malformed event frame, duplicate edit, invalid model change, or events that do not describe the candidate (a before-image differs from the draft state, or a candidate record is not the final after-image)'}
        '409': {description: Conflicting generation, event UUID or writer lease}
        '413': {description: 'Event journal (4096 events or 8 MiB) or candidate (20000 changes or 8 MiB) is full; nothing is written. A local Commit empties both'}
  /working-copies/{draftId}/save:
    parameters:
      - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: saveWorkingCopyChanges
      description: |
        Transactionally merge 1..128 model changes into the private candidate.
        The session, live fencing token and exact expected generation are
        required. generation is a decimal string (not an imprecise JSON number).
        Each change is either uuid+delete:true or uuid+kind+references+payloadBase64,
        using the same typed native model-envelope semantics as model-commits.
        Saved drafts survive restart; this endpoint NEVER creates a commit or
        advances a branch HEAD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, fencingToken, expectedGeneration, changes]
              properties:
                sessionId: {type: string, format: uuid}
                fencingToken: {type: string, format: uuid}
                expectedGeneration: {type: string, pattern: '^[0-9]{1,20}$'}
                changes:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items:
                    type: object
                    description: Model change; uuid+delete:true, or uuid+kind+references+payloadBase64
      responses:
        '200': {description: Saved draft with incremented generation decimal string and full candidate overlay}
        '409': {description: Stale generation, fencing token or expired lease}
  /working-copies/{draftId}/release:
    parameters:
      - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: releaseWorkingCopyLease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, fencingToken]
              properties:
                sessionId: {type: string, format: uuid}
                fencingToken: {type: string, format: uuid}
      responses:
        '200': {description: '{"released":true}; also when no lease is held any more (idempotent release)'}
        '409': {description: Lease is held by another session or token}
  /working-copies/{draftId}/discard:
    parameters:
      - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: discardWorkingCopy
      description: |
        Remove a draft for good. Fenced like a Save (live lease holder, token,
        current generation). Committed revisions and local Commit records are
        unaffected. After a successful Commit the draft is rebased onto the new
        HEAD (generation + 1, empty candidate and event journal), so it can be
        kept and edited further instead of discarded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, fencingToken, expectedGeneration]
              properties:
                sessionId: {type: string, format: uuid}
                fencingToken: {type: string, format: uuid}
                expectedGeneration: {type: string, pattern: '^[0-9]+$'}
      responses:
        '200': {description: '{"discarded":true}'}
        '404': {description: Draft not found (also for a repeated request after success)}
        '409': {description: Stale lease, fencing token or generation}
  /projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: Published projects ordered by UUID
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: {$ref: '#/components/schemas/Project'}
    post:
      operationId: createProject
      description: |
        With unborn:true (what clients should always send) creates main with a
        durable UUIDv7 branch identity, explicit null HEAD and zero revisions.
        Without it, main still gets an empty first revision, which needs
        `author` (the message defaults to "Create project <name>"); that
        deviation from the version-control contract will be removed. With
        unborn:true there is no revision, so author and message are rejected.
        A caller-chosen `id` (requires unborn:true) makes creation idempotent:
        repeating the request returns the same project with 201; the same id
        with another name is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                id: {type: string, format: uuid, description: Caller-chosen project UUIDv7 (retry-safe creation)}
                name: {type: string, minLength: 1, maxLength: 200}
                unborn: {type: boolean, default: false}
                author: {$ref: '#/components/schemas/CommitAuthor'}
                message: {$ref: '#/components/schemas/CommitMessage'}
      responses:
        '201':
          description: Project and initial main branch published (optionally unborn), or the existing project for a repeated id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/clone-target:
    post:
      operationId: provisionCloneTarget
      description: |
        Idempotently provision an empty destination project with the exact
        logical UUIDv7 and display name supplied by the remote source. No
        branch or revision is created. Used immediately before importing a
        full UUIDv7 revision bundle into the personal repository. A differing
        existing project name is a conflict. This is identity provisioning,
        not a merge or a project copy by itself. Unborn branch transfer is
        not supported by revision bundles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, name]
              properties:
                projectId: {type: string, format: uuid, description: Existing logical UUIDv7 from source}
                name: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200': {description: Existing matching or newly provisioned empty project}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/unborn-checkout:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: checkoutUnbornBranch
      description: |
        Provision an unborn root branch in an empty private clone target with
        the source branch's exact UUIDv7 and a null HEAD. Does not create a
        revision or fetch a bundle. Conflicting target/provenance is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [branchId, name]
              properties:
                branchId: {type: string, format: uuid, description: Original branch UUIDv7}
                name: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200': {description: Original branch UUID, name and null HEAD}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/branches/{branch}/bundle:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
    get:
      operationId: exportRevisionBundle
      description: |
        UUIDv7 revision-graph transfer, separate from SHA revision bundles.
        AOWREV21 full bundle or AOWREV22 incremental when the source branch
        has no recorded origin; provenance-aware AOWREV23 full or AOWREV24
        incremental otherwise. Existing importers must be upgraded to read
        provenance-aware formats. Incremental bundles use the specified
        recipient-base revision UUIDv7. Uses project-scoped scratch files,
        chunked HTTP streaming and the global transfer staging quota. Does
        not support network resumption or authentication.
      parameters:
        - name: base
          in: query
          required: false
          schema: {type: string, format: uuid, description: UUIDv7 revision ID}
      responses:
        '200':
          description: Verified full or incremental UUIDv7 revision bundle
          content:
            application/vnd.aowis.revision-bundle-v2:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: Export exceeds configured limit}
        '503': {description: Staging quota or repository queue exhausted}
        '507': {description: Scratch storage exhausted}
    post:
      operationId: importRevisionBundle
      description: |
        Bounded disk-backed UUIDv7 revision import. The project ID in the URL
        must equal the imported bundle's project UUID. Preserves both branch
        and revision UUIDs; rejects divergent/stale bases. Imports commit the
        verified immutable closure before atomically publishing the HEAD.
        The server currently provides no caller authentication.
      requestBody:
        required: true
        content:
          application/vnd.aowis.revision-bundle-v2:
            schema: {type: string, format: binary}
      responses:
        '200': {description: Fast-forward or idempotent replay, including head UUIDv7 and objectsImported}
        '201': {description: Destination branch created with the replicated branch UUIDv7}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: Upload exceeds configured limit}
        '503': {description: Staging quota or repository queue exhausted}
        '507': {description: Scratch storage exhausted}
  /projects/{projectId}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: getProject
      responses:
        '200':
          description: Project metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: renameProject
      description: |
        Persistently change only the project display name. UUIDv7 identity,
        branches, revisions and network data are unchanged. expectedName is
        required to reject stale edits from another client (HTTP 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedName, name]
              properties:
                expectedName: {type: string, description: Name last read from the server}
                name: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200': {description: Updated project identity and name}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/branches:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: listBranches
      responses:
        '200':
          description: Branch names
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items: {type: string}
    post:
      operationId: createBranch
      description: |
        With `unborn: true`, create an independent branch with null committed
        HEAD and no source branch or revision. Otherwise create a UUIDv7 branch
        reference from `fromBranchId` (at its HEAD, or a historical revision
        reachable from it). Neither variant creates a revision. With a
        caller-chosen `id`, an identical retry returns 201 and the same branch
        identity; a conflicting name or UUID returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                id: {type: string, format: uuid, description: Caller-chosen UUIDv7 of the new branch (retry-safe creation)}
                name: {type: string}
                unborn: {type: boolean, description: Set true for an independent unborn branch without an origin}
                description: {type: string, description: Optional branch description for unborn creation (max 512 UTF-8 bytes)}
                tags:
                  type: array
                  description: Optional branch tags for unborn creation (maximum 12, each at most 32 UTF-8 bytes)
                  maxItems: 12
                  uniqueItems: true
                  items: {type: string}
                fromBranchId: {type: string, format: uuid, description: Required for a derived branch; forbidden when unborn is true}
                revision: {type: string, format: uuid, description: Historical revision UUIDv7 reachable from the source; forbidden when unborn is true}
      responses:
        '201':
          description: Atomic branch creation result; fork provenance is immutable metadata, not an ancestry edge
          content:
            application/json:
              schema:
                type: object
                required: [id, branch, branchId, originBranchId, forkRevisionId]
                properties:
                  id:
                    oneOf:
                      - {type: string, format: uuid}
                      - {type: 'null'}
                    description: Exact committed fork revision UUIDv7, or null for an unborn branch
                  branch: {type: string, description: Newly created branch name}
                  branchId: {type: string, format: uuid, description: Persistent UUIDv7 of the new branch}
                  description: {type: string, description: Stored branch description (unborn creation only)}
                  tags:
                    type: array
                    items: {type: string}
                  originBranchId:
                    oneOf:
                      - {type: string, format: uuid}
                      - {type: 'null'}
                  forkRevisionId:
                    oneOf:
                      - {type: string, format: uuid}
                      - {type: 'null'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/branches/{branch}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
    patch:
      operationId: renameBranch
      description: Atomically change the user-chosen name, preserving branch UUID and revision HEAD. Requires exact expected UUIDv7 HEAD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, expectedHead]
              properties:
                name: {type: string}
                expectedHead: {type: string, format: uuid}
      responses:
        '200': {description: Renamed branch and unchanged HEAD}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/branch-ids/{branchId}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: branchId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateBranchProperties
      description: |
        Compare-and-swap editable branch name, tags and description, including
        unborn branches. Revision records and branch UUIDv7 remain unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedName, name, tags, description]
              properties:
                expectedName: {type: string}
                name: {type: string}
                tags: {type: array, items: {type: string}}
                description: {type: string}
      responses:
        '200': {description: Updated branch metadata}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      operationId: getBranchById
      description: The branch with this UUIDv7, whatever its current name. Same fields as a revision-graph HEAD.
      responses:
        '200':
          description: Branch name, HEAD (null when unborn), record hash and creation provenance
          content:
            application/json:
              schema:
                type: object
                required: [branch, branchId, revision, recordHash, originBranchId, forkRevisionId]
                properties:
                  branch: {type: string}
                  branchId: {type: string, format: uuid}
                  revision: {type: [string, 'null'], format: uuid}
                  recordHash: {type: [string, 'null']}
                  originBranchId: {type: [string, 'null'], format: uuid}
                  forkRevisionId: {type: [string, 'null'], format: uuid}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/branches/{branch}/head:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
    get:
      operationId: getBranchHead
      responses:
        '200':
          description: Current revision UUIDv7 in id, or explicit null for unborn branch
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: {type: [string, 'null'], format: uuid, description: UUIDv7 revision or null before first commit}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/branches/{branch}/history:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      - {name: after, in: query, schema: {type: string, format: uuid}}
    get:
      operationId: getBranchHistory
      description: First-parent history, newest-first, using an exclusive UUIDv7 revision cursor. Unborn branches return an empty array.
      responses:
        '200':
          description: '{revisions: [Revision]}, newest first'
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions: {type: array, items: {$ref: '#/components/schemas/Revision'}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /projects/{projectId}/revisions/{revision}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: revision, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getRevision
      description: Immutable revision UUIDv7 lookup authenticated against its canonical record SHA-256 and parent ancestry.
      responses:
        '200':
          description: The immutable revision with its author, message and commit time
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/revisions/{revision}/message:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: revision, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateRevisionDisplayMessage
      description: |
        Update only mutable display-message annotation using compare-and-swap.
        The original commit message, immutable record, hashes and UUIDv7 do not change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedMessage, message]
              properties:
                expectedMessage: {type: string}
                message: {type: string, minLength: 1}
      responses:
        '200': {description: Display annotation updated}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/revision-graph:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      - {name: cursor, in: query, schema: {type: string, description: Opaque, HMAC-signed, project-scoped and process-local continuation token}}
    get:
      operationId: getRevisionGraph
      description: |
        The union of all branch HEAD ancestry, both merge
        parents and deduplicated revisions. HEADs include branch UUIDv7,
        branch name, revision UUIDv7 and record SHA-256. HEADs additionally
        include `originBranchId` and `forkRevisionId` (UUIDv7 or null),
        immutable creation provenance distinct from revision ancestry. Revisions contain id,
        recordHash, snapshot roots, modelIndexed, parents (revision UUID array),
        parentRecordHashes (corresponding SHA-256 array), author, message and
        committedAtMs.
        Unborn HEADs have explicit null revision and recordHash, and do not
        contribute revision ancestry. HEAD snapshots are pinned into authenticated cursors across refreshes.
        Cursors are invalid after server restart or when used for another project.
        Pagination bounds are 1..1000 items, up to 1024 branch HEADs and
        250000 traversed revisions. The complete boolean and nextCursor are
        always explicit.
      responses:
        '200':
          description: Pinned, paginated UUIDv7 revision DAG with heads, revisions, complete and nextCursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevisionGraphPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {description: Graph traversal or response budget exceeded}
  /projects/{projectId}/branches/{branch}/model-commits:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
    post:
      operationId: commitModel
      description: >-
        Atomically create a UUIDv7 model-indexed revision on an exact expected
        branch HEAD. The model record payload is opaque binary data encoded
        as Base64; hydraulic clients must encode it with the existing
        ModelCodec. This generic native-record operation enforces reference
        integrity, not hydraulic field-level semantic validation. Rejects
        duplicate keys, invalid references, stale heads and batches
        exceeding 128 changes. This is the canonical model-commit route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedHead, changes, author, message]
              properties:
                author: {$ref: '#/components/schemas/CommitAuthor'}
                message: {$ref: '#/components/schemas/CommitMessage'}
                expectedHead: {type: string, format: uuid, description: Revision UUIDv7}
                changes:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items:
                    type: object
                    description: >-
                      uuid plus delete:true, or uuid, kind (uint16), references
                      (array of canonical UUIDs), payloadBase64 (canonical bytes).
                    properties:
                      uuid: {type: string, format: uuid}
                      delete: {type: boolean, enum: [true]}
                      kind: {type: integer, minimum: 0, maximum: 65535}
                      references: {type: array, items: {type: string, format: uuid}}
                      payloadBase64: {type: string, format: byte}
      responses:
        '201': {description: New revision UUIDv7 in `id` field}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: Request exceeds bounded resource limits}
  /projects/{projectId}/merges:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: mergeBranches
      description: >-
        Generic UUIDv7 three-way merge. Always requires both exact expected
        HEAD UUIDs. Domain-specific hydraulic field and object resolution is
        exposed separately via /hydraulic-merges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target, source, expectedTargetHead, expectedSourceHead, author]
              properties:
                author: {$ref: '#/components/schemas/CommitAuthor'}
                message:
                  allOf: [{$ref: '#/components/schemas/CommitMessage'}]
                  description: 'Optional; default "Merge <source> into <target>"'
                target: {type: string}
                source: {type: string}
                expectedTargetHead: {type: string, format: uuid}
                expectedSourceHead: {type: string, format: uuid}
      responses:
        '200': {description: Merge status, resulting target UUIDv7 HEAD, and conflicts}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/hydraulic-merges:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: mergeHydraulicBranches
      description: >-
        Domain-validated hydraulic branch merge. Both expected
        HEAD UUIDs are mandatory, even when no conflict choices are supplied.
        Reconciles canonical typed fields and membership chunks and validates
        the entire candidate hydraulic network before publication, including
        fast-forward merges. A 409 conflict leaves both branch HEADs intact.
        Field/object choices may target only actual conflicts; unknown,
        duplicated, unused or stale choices are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target, source, expectedTargetHead, expectedSourceHead, author]
              properties:
                author: {$ref: '#/components/schemas/CommitAuthor'}
                message:
                  allOf: [{$ref: '#/components/schemas/CommitMessage'}]
                  description: 'Optional; default "Merge <source> into <target>"'
                target: {type: string}
                source: {type: string}
                expectedTargetHead: {type: string, format: uuid}
                expectedSourceHead: {type: string, format: uuid}
                fieldChoices:
                  type: array
                  maxItems: 128
                  items:
                    type: object
                    additionalProperties: false
                    required: [entityUuid, field, side]
                    properties:
                      entityUuid: {type: string, format: uuid}
                      field: {type: string}
                      side: {type: string, enum: [target, source]}
                objectChoices:
                  type: array
                  maxItems: 128
                  items:
                    type: object
                    additionalProperties: false
                    required: [entityUuid, side]
                    properties:
                      entityUuid: {type: string, format: uuid}
                      side: {type: string, enum: [target, source]}
      responses:
        '200': {description: Merge status, UUIDv7 target HEAD and any conflicts}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: Exceeds bounded request size or 128 total choices}
  /projects/{projectId}/diff:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: from, in: query, required: true, schema: {type: string, format: uuid}}
      - {name: to, in: query, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: diffRevisions
      description: >-
        Compare two immutable, project-owned UUIDv7 revision snapshots.
        Returns at most 1000 changed model/object keys, otherwise HTTP 413.
        SHA-256 values are integrity hashes, not revision identities.
      responses:
        '200': {description: Changed UUIDs, with before/after content SHA-256 hashes}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {description: Difference count exceeds 1000}
  /projects/{projectId}/branches/{branch}/networks:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
    post:
      operationId: saveHydraulicNetwork
      description: |
        Create/replace a complete, canonically validated hydraulic network on
        a UUIDv7 project and branch. The exact expected revision HEAD must
        match at atomic publication. Revision UUID and content SHA are separate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedHead, payloadBase64, author, message]
              properties:
                author: {$ref: '#/components/schemas/CommitAuthor'}
                message: {$ref: '#/components/schemas/CommitMessage'}
                expectedHead: {type: string, format: uuid, description: UUIDv7 revision}
                payloadBase64: {type: string, contentEncoding: base64, description: Canonical NetworkHydraulic model bytes}
      responses:
        '201': {description: '{"id":"<new UUIDv7 revision>"}'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/branches/{branch}/networks/summary:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - {name: revision, in: query, required: false, schema: {type: string, format: uuid}, description: Exact immutable revision to summarize; omitted selects the committed branch tip}
    get:
      operationId: getCommittedHydraulicNetworkSummary
      description: |
        Revision-pinned inventory of canonical hydraulic network roots and
        their 18 collection counts. This is the COMMITTED snapshot only; an
        unborn HEAD returns zero committed networks, which does not prove a
        private working copy contains no network or changes. Clients must
        not use this endpoint to authorize destructive draft imports.
      responses:
        '200':
          description: Committed revision identity and network counts
          content:
            application/json:
              schema:
                type: object
                required: [scope, revision, networkCount, networks]
                properties:
                  scope: {type: string, enum: [committed]}
                  revision:
                    oneOf:
                      - {type: string, format: uuid}
                      - {type: 'null'}
                  networkCount: {type: integer, minimum: 0}
                  networks:
                    type: array
                    items:
                      type: object
                      required: [id, title, counts, entityCount]
                      properties:
                        id: {type: string, format: uuid}
                        title: {type: string}
                        counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
                        entityCount: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/branches/{branch}/networks/{networkId}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - {$ref: '#/components/parameters/NetworkId'}
      - {name: revision, in: query, required: false, schema: {type: string, format: uuid}, description: UUIDv7 revision in this branch ancestry; omitted selects current HEAD}
    get:
      operationId: getHydraulicNetwork
      description: Pin one UUIDv7 revision, verify hydraulic metadata and all member references, then load the complete canonical payload.
      responses:
        '200': {description: Canonical network payload with UUIDv7 revision}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/branches/{branch}/networks/{networkId}/entities:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - {$ref: '#/components/parameters/NetworkId'}
      - {name: revision, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: type, in: query, required: true, schema: {type: integer, minimum: 0, maximum: 17}}
    get:
      operationId: listHydraulicEntities
      description: List one collection's ordered UUIDs at a pinned UUIDv7 revision; 10000 maximum.
      responses:
        '200': {description: Entity UUID list with UUIDv7 revision}
        '413': {description: Requested collection exceeds limit}
  /projects/{projectId}/branches/{branch}/networks/{networkId}/entities/{entityId}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - {$ref: '#/components/parameters/NetworkId'}
      - {name: revision, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: entityId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getHydraulicEntity
      description: Index-backed, ownership-checked canonical entity read at one immutable revision UUID.
      responses:
        '200': {description: Entity UUID, collection ordinal, canonical payload and UUIDv7 revision}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/branches/{branch}/networks/{networkId}/edits:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - {$ref: '#/components/parameters/NetworkId'}
    post:
      operationId: editHydraulicNetwork
      description: |
        Apply at most 128 entity changes to one branch at an exact
        expectedHead. Scalar, physical, catalogue, topology, dependent-reference
        and membership edits are validated incrementally against the pinned
        revision; other edits fall back to full network validation. A batch
        that changes nothing creates no revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedHead, changes, author, message]
              properties:
                author: {$ref: '#/components/schemas/CommitAuthor'}
                message: {$ref: '#/components/schemas/CommitMessage'}
                expectedHead: {type: string, format: uuid}
                changes:
                  type: array
                  maxItems: 128
                  items:
                    oneOf:
                      - {type: object, additionalProperties: false, required: [uuid, delete], properties: {uuid: {type: string, format: uuid}, delete: {const: true}}}
                      - {type: object, additionalProperties: false, required: [uuid, type, payloadBase64], properties: {uuid: {type: string, format: uuid}, type: {type: integer, minimum: 0, maximum: 17}, payloadBase64: {type: string, contentEncoding: base64}}}
      responses:
        '200': {description: '{"id":"<new or unchanged UUIDv7 revision>"}'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}

components:
  schemas:
    CanonicalPayload:
      type: object
      required: [revision, uuid, payloadBase64]
      properties:
        revision: {$ref: '#/components/schemas/RevisionId'}
        uuid: {type: string, format: uuid}
        type: {type: integer, minimum: 0, maximum: 17}
        payloadBase64: {type: string, contentEncoding: base64}
    BundleImportResult:
      type: object
      required: [status, head, objectsImported]
      properties:
        status: {type: string, enum: [created, fast_forward, up_to_date]}
        head: {$ref: '#/components/schemas/RevisionId'}
        objectsImported: {type: integer, minimum: 0}
    RevisionGraphPage:
      type: object
      required: [heads, revisions, complete, nextCursor]
      properties:
        heads:
          type: array
          description: Sorted branch HEAD snapshot, identical on each page
          items:
            type: object
            required: [branch, branchId, revision, recordHash, originBranchId, forkRevisionId]
            properties:
              branch: {type: string}
              branchId: {type: string, format: uuid}
              revision: {type: [string, 'null'], format: uuid, description: Null for an unborn branch}
              recordHash:
                oneOf:
                  - {$ref: '#/components/schemas/RevisionHash'}
                  - {type: 'null'}
              originBranchId: {type: [string, 'null'], format: uuid}
              forkRevisionId: {type: [string, 'null'], format: uuid}
        revisions:
          type: array
          description: Deduplicated immutable revisions, deterministic DFS order
          maxItems: 1000
          items: {$ref: '#/components/schemas/Revision'}
        complete: {type: boolean, description: True when no further revisions remain}
        nextCursor:
          oneOf:
            - {type: string}
            - {type: 'null'}
          description: Null exactly when complete is true
    RevisionHash: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 (integrity, never an identity)}
    RevisionId: {type: string, format: uuid, description: Revision UUIDv7}
    CommitAuthor:
      type: object
      additionalProperties: false
      required: [id, name]
      description: Self-reported author of a revision; not authenticated.
      properties:
        id: {type: string, format: uuid, description: Author UUIDv7}
        name: {type: string, minLength: 1, description: '1..200 bytes of UTF-8 without control characters'}
    CommitMessage:
      type: string
      minLength: 1
      description: '1..65536 bytes of UTF-8; tab and newline are the only allowed control characters'
    CommittedAt:
      type: string
      pattern: '^[0-9]{1,20}$'
      description: Time the repository published the revision, Unix epoch milliseconds (UTC), as a decimal string
    Project:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Revision:
      type: object
      required: [id, recordHash, root, referencesRoot, modelIndexed, parents, parentRecordHashes,
                 author, message, committedAtMs]
      properties:
        id: {$ref: '#/components/schemas/RevisionId'}
        recordHash: {$ref: '#/components/schemas/RevisionHash'}
        root: {$ref: '#/components/schemas/RevisionHash'}
        referencesRoot: {$ref: '#/components/schemas/RevisionHash'}
        modelIndexed: {type: boolean}
        parents:
          type: array
          maxItems: 2
          description: Ordered parent revision UUIDv7s (target first for a merge)
          items: {$ref: '#/components/schemas/RevisionId'}
        parentRecordHashes:
          type: array
          maxItems: 2
          items: {$ref: '#/components/schemas/RevisionHash'}
        author: {$ref: '#/components/schemas/CommitAuthor'}
        message: {$ref: '#/components/schemas/CommitMessage'}
        committedAtMs: {$ref: '#/components/schemas/CommittedAt'}
    Error:
      type: object
      description: >-
        Every error is classified by the engine's StorageErrorKind, never by
        message text. Global mapping: invalid_request 400, not_found 404,
        conflict 409, limit_exceeded 413, unavailable 503, busy 503 (project
        queue full, with Retry-After), staging_busy 503 (global HTTP
        staging reservations exhausted, with Retry-After),
        insufficient_storage 507, internal_error 500. 5xx responses carry a
        generic message only; details (corruption, I/O, paths) are written to
        the service log. Bundle routes use transfer-specific codes
        (invalid_bundle 400, divergent_history / invalid_base 409,
        transfer_too_large 413). JSON requests without Content-Length return 411 length_required; oversized URIs 414 uri_too_long. Hashes of existing objects that are not
        revisions are reported as not_found.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
  parameters:
    NetworkId:
      name: networkId
      in: path
      required: true
      schema: {type: string, format: uuid}
    OptionalRevision:
      name: revision
      in: query
      required: false
      description: Explicit immutable revision snapshot; must be the branch head or one of its ancestors (otherwise 404). Defaults to the branch head captured once
      schema: {$ref: '#/components/schemas/RevisionId'}
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Branch:
      name: branch
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 96
        description: Valid UTF-8 branch label (maximum 96 bytes); internal spaces allowed, control characters and path delimiters rejected
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: A resource already exists or revision conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServerError:
      description: Storage corruption, I/O or internal failure (generic message; details in the service log)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Repository handle must be reopened (for example after an interrupted compaction)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InsufficientStorage:
      description: The server's storage is exhausted (ENOSPC/EDQUOT)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
